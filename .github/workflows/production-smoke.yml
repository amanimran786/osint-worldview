name: Production Readiness Smoke

on:
  deployment_status:
  workflow_dispatch:

jobs:
  smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node scripts/production-smoke.mjs
        env:
          WORLDVIEW_PRODUCTION_URL: >-
            ${{ github.event_name == 'deployment_status' &&
                (github.event.deployment_status.environment_url ||
                 github.event.deployment_status.target_url) ||
                'https://osint-worldview-cyan.vercel.app' }}
